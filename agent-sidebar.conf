# tmux-agent-sidebar plugin
# Load via the entry point script:
#   run-shell /path/to/tmux-agent-sidebar.tmux
#
# Customizable options (set BEFORE loading to override):
#   @sidebar_width        - sidebar width in columns, or percentage of window width (default: 15%)
#   @sidebar_position     - sidebar placement: left or right (default: left)
#   @sidebar_bottom_height - bottom panel height in lines (default: 20, 0 to hide)
#   @sidebar_default_view - status filter view the sidebar lands on when it opens:
#                           all, running, background, waiting, idle, or error
#                           (default: all)
#   @sidebar_default_compact_view - whether a newly opened sidebar starts in
#                           compact mode (one line per agent; toggle live with
#                           `c` inside the sidebar). on or off (default: off)
#   @sidebar_popup_max_width - windows narrower than this many columns open the
#                              sidebar as a tmux popup (popover) instead of a
#                              split pane; the popup hides the activity/git
#                              bottom panel to stay readable on small screens.
#                              Entering the popup view stops any split-pane
#                              sidebars still running in the session, and a
#                              toggle press on a narrow window swaps a desktop
#                              split pane for the popup directly
#                              (default: 100, 0 to always use a split pane).
#                              The toggle-all sweep ignores this threshold and
#                              creates split panes everywhere, so "open on
#                              every window" stays uniform even when a small
#                              client has shrunk some windows. On viewports
#                              narrower than this threshold the sidebar also
#                              auto-hides when the window shrinks (see
#                              @sidebar_auto_hide): the next toggle press
#                              opens the modal popup.
#   @sidebar_auto_hide    - auto-hide split-pane sidebars when a window
#                           shrinks below @sidebar_popup_max_width (a phone or
#                           other small client attached or resized): the
#                           toggle-all close sweep takes down every
#                           split-pane sidebar in every session — a phone
#                           client sees all sessions, so closing only the
#                           resized window's pane would leave slivers behind
#                           on session switches — and records "closed" mode
#                           so auto-create stays off until the next
#                           toggle-all. The next toggle press then opens the
#                           modal popup. Only an actual downward crossing of
#                           the threshold counts, so sidebars deliberately
#                           created by the toggle-all sweep on narrow
#                           windows are left alone. on or off (default: on)
#   @sidebar_auto_create  - create sidebar automatically for new windows and
#                           sessions (default: on)
#   @sidebar_auto_create_delay - seconds to defer auto-create after a new window
#                                or session is created so a declaratively-built
#                                window (e.g. tmuxinator's split-window +
#                                select-layout) finishes first; accepts fractional
#                                seconds (default: 0)
#   @sidebar_pet          - show pet animation in bottom panel (default: off)
#   @sidebar_key          - keybinding to toggle sidebar (default: e)
#   @sidebar_key_all      - keybinding to toggle sidebar in all windows (default: E)
#   @sidebar_color_*      - 256-color codes or #RRGGBB hex colors for sidebar elements
#
# Internal tmux options used by the plugin:
#   @agent_sidebar_dir    - plugin directory (auto-detected by tmux-agent-sidebar.tmux)
#   @sidebar_pid          - pid of the sidebar process owning a pane; cleared on
#                           exit, and only signaled after the notify-focus hook
#                           verifies it still belongs to the sidebar binary
#   @sidebar_mode         - system-level state written by toggle-all and the
#                           maintain-width mobile takeover ("open" /
#                           "closed"); new windows and sessions consult it
#                           (falling back to @sidebar_auto_create while unset)
#                           to decide whether to create a sidebar, making
#                           prefix+E mean "always on/off everywhere" for future
#                           windows and sessions too
#   @sidebar_last_window_width - last window width observed by the
#                           maintain-width hook (window-scoped, written by the
#                           plugin); used to detect a downward crossing of
#                           @sidebar_popup_max_width
#   @sidebar_mobile_restore / @sidebar_mobile_prior_mode - takeover
#                           markers written by the maintain-width mobile
#                           takeover (which windows had sidebars, and the
#                           prior mode). When a window later grows back to
#                           @sidebar_popup_max_width and no narrow client
#                           is attached, those sidebars are restored and
#                           the markers cleared. A deliberate toggle-all
#                           close records nothing and is never undone.

# --- Plugin location ---
# @agent_sidebar_dir must be set by tmux-agent-sidebar.tmux before sourcing this file

# --- Sidebar options ---
# Colors are managed in Rust (src/ui/colors.rs). Users may override any
# @sidebar_color_* tmux option in their own config. Non-color sidebar
# options are seeded here only when unset.
if -F '#{==:#{@sidebar_width},}' 'set -g @sidebar_width 15%'
if -F '#{==:#{@sidebar_position},}' 'set -g @sidebar_position left'
if -F '#{==:#{@sidebar_bottom_height},}' 'set -g @sidebar_bottom_height 20'
if -F '#{==:#{@sidebar_default_view},}' 'set -g @sidebar_default_view all'
if -F '#{==:#{@sidebar_default_compact_view},}' 'set -g @sidebar_default_compact_view off'
if -F '#{==:#{@sidebar_default_show_windows},}' 'set -g @sidebar_default_show_windows off'
# How the agents panel groups panes: "repo" (git repo root, default) or
# "session" (tmux session name — with @sidebar_show_windows on, the panel
# becomes an agent-forward session manager).
if -F '#{==:#{@sidebar_group_by},}' 'set -g @sidebar_group_by repo'
if -F '#{==:#{@sidebar_popup_max_width},}' 'set -g @sidebar_popup_max_width 100'
if -F '#{==:#{@sidebar_auto_hide},}' 'set -g @sidebar_auto_hide on'
if -F '#{==:#{@sidebar_auto_create},}' 'set -g @sidebar_auto_create on'
if -F '#{==:#{@sidebar_auto_create_delay},}' 'set -g @sidebar_auto_create_delay 0'
if -F '#{==:#{@sidebar_pet},}' 'set -g @sidebar_pet off'
if -F '#{==:#{@sidebar_key},}' 'set -g @sidebar_key e'
if -F '#{==:#{@sidebar_key_all},}' 'set -g @sidebar_key_all E'

# --- Keybindings ---
run-shell 'key="$(tmux display-message -p "#{@sidebar_key}")"; bin="$(tmux display-message -p "#{@agent_sidebar_bin}")"; tmux bind "$key" run-shell "\"$bin\" toggle \"##{window_id}\" \"##{pane_current_path}\""'
run-shell 'key="$(tmux display-message -p "#{@sidebar_key_all}")"; bin="$(tmux display-message -p "#{@agent_sidebar_bin}")"; tmux bind "$key" run-shell "\"$bin\" toggle-all"'

# --- Hooks (remove our own entries first to prevent duplicates on config reload) ---
run-shell 'tmux show-hooks -g after-new-window | awk "/@agent_sidebar_bin/ && /toggle --create-only/ { print \$1 }" | xargs -rn1 tmux set-hook -gu'
run-shell 'tmux show-hooks -g after-new-session | awk "/@agent_sidebar_bin/ && /toggle --create-only/ { print \$1 }" | xargs -rn1 tmux set-hook -gu'
run-shell 'tmux show-hooks -g after-select-pane | awk "/@sidebar_pid/ && /kill -USR1/ { print \$1 }" | xargs -rn1 tmux set-hook -gu'
run-shell 'tmux show-hooks -g after-select-window | awk "/@sidebar_pid/ && /kill -USR1/ { print \$1 }" | xargs -rn1 tmux set-hook -gu'
# Legacy kill -USR1 hooks (pre-identity-check) are removed above; these
# clear the current notify-focus hooks before re-registering below.
run-shell 'tmux show-hooks -g after-select-pane | awk "/notify-focus/ { print \$1 }" | xargs -rn1 tmux set-hook -gu'
run-shell 'tmux show-hooks -g after-select-window | awk "/notify-focus/ { print \$1 }" | xargs -rn1 tmux set-hook -gu'
run-shell 'tmux show-hooks -g client-session-changed | awk "/notify-focus/ { print \$1 }" | xargs -rn1 tmux set-hook -gu'
run-shell 'tmux show-hooks -g pane-exited | awk "/@agent_sidebar_bin/ && /auto-close/ { print \$1 }" | xargs -rn1 tmux set-hook -gu'
run-shell 'tmux show-hooks -g window-layout-changed | awk "/@agent_sidebar_bin/ && /maintain-width/ { print \$1 }" | xargs -rn1 tmux set-hook -gu'
run-shell 'tmux show-hooks -g client-resized | awk "/@agent_sidebar_bin/ && /maintain-width/ { print \$1 }" | xargs -rn1 tmux set-hook -gu'

# --- Auto sidebar on new window / new session (create-only, no toggle) ---
# The hooks fire on every new window and every new session; whether a
# sidebar is actually created is decided by the binary at fire time from
# @sidebar_mode (written by toggle-all: `open`/`closed`) and, while no
# mode is recorded, from @sidebar_auto_create. Consulting at fire time
# (instead of registering the hook conditionally at load time) is what
# makes toggle-all mean "always on/off everywhere" for windows and
# sessions created afterwards. With @sidebar_auto_create_delay non-zero,
# the split is deferred into a backgrounded shell that sleeps first —
# this lets a declaratively-built window (e.g. tmuxinator's split-window
# + select-layout) finish before the sidebar pane is injected. The
# sync/deferred choice is fixed at load time; the duration itself is
# read at fire time.
#
# after-new-session is required in addition to after-new-window: tmux
# does NOT fire after-new-window for the initial window of a session
# created with `new-session` (verified on tmux 3.7c), so without it a
# new session opened while @sidebar_mode is `open` stays sidebar-less.
# The window/pane format vars resolve to the new session's initial
# window in the after-new-session context. Both hooks route through the
# same `--create-only` path, which is idempotent (an existing sidebar is
# left alone), so a tmux version that fires both on session creation
# cannot produce a duplicate pane.
if -F '#{==:#{@sidebar_auto_create_delay},0}' {
  set-hook -ga after-new-window 'run-shell "\"#{@agent_sidebar_bin}\" toggle --create-only \"#{window_id}\" \"#{pane_current_path}\""'
  set-hook -ga after-new-session 'run-shell "\"#{@agent_sidebar_bin}\" toggle --create-only \"#{window_id}\" \"#{pane_current_path}\""'
} {
  set-hook -ga after-new-window 'run-shell -b "sleep \"#{@sidebar_auto_create_delay}\"; \"#{@agent_sidebar_bin}\" toggle --create-only \"#{window_id}\" \"#{pane_current_path}\""'
  set-hook -ga after-new-session 'run-shell -b "sleep \"#{@sidebar_auto_create_delay}\"; \"#{@agent_sidebar_bin}\" toggle --create-only \"#{window_id}\" \"#{pane_current_path}\""'
}

# --- Notify sidebar on pane/window focus change (SIGUSR1 → instant refresh) ---
# notify-focus checks each @sidebar_pid against the running process
# (/proc/$pid/exe on Linux, ps fallback on macOS) before signaling, so a
# stale or recycled pid can never receive SIGUSR1 — whose default
# disposition would terminate the unrelated new owner.
#
# client-session-changed covers the case the select hooks cannot: a plain
# `switch-client` (session chooser, next/previous session, the sidebar's
# own agent jump) fires NO after-select-* hook, so without it the sidebar
# in the destination session redraws from up-to-1s-old state and snaps on
# the next periodic tick. The hook fires with the client's new session as
# context, so #{window_id} expands to the window the user just landed on.
set-hook -ga after-select-pane "run-shell -b '\"#{@agent_sidebar_bin}\" notify-focus \"#{window_id}\"'"
set-hook -ga after-select-window "run-shell -b '\"#{@agent_sidebar_bin}\" notify-focus \"#{window_id}\"'"
set-hook -ga client-session-changed "run-shell -b '\"#{@agent_sidebar_bin}\" notify-focus \"#{window_id}\"'"

# --- Auto close window when only sidebar remains ---
set-hook -ga pane-exited 'run-shell "\"#{@agent_sidebar_bin}\" auto-close \"#{window_id}\""'

# --- Auto-hide the sidebars when a window shrinks below the popup threshold ---
# `maintain-width` fires when a window with a split-pane sidebar just crossed
# @sidebar_popup_max_width downward (a phone client attached, or an existing
# small client shrank the window). That crossing is the mobile-detection
# signal, and the response is the toggle-all close sweep: every split-pane
# sidebar in every session comes down (a phone client sees all sessions, and
# no layout hook fires in the others on a session switch, so a per-window
# close would leave slivers behind), and @sidebar_mode records "closed" so
# auto-create stays off until the next toggle-all. The next toggle press then
# opens the modal popup. The subcommand is idempotent and cheap, so firing it
# on both events is safe: client-resized is the one that fires when a phone
# client attaches or resizes (a pure client resize does not fire
# window-layout-changed), while window-layout-changed covers pane-level
# layout churn.
#
# window-layout-changed does not exist before tmux 3.2 (the hook name is
# rejected by `set-hook` on older servers), so the registration is gated on a
# shell version check and silently skipped below 3.2 — the feature is simply
# absent there, and no stale hook is left behind (the dedup block above still
# removes any entries on every reload).
#
# Quoting matters here: when the hook fires, tmux re-parses the stored command
# line, so `run-shell` must receive the binary + subcommand + window id as ONE
# argument. The `\"` opens a single quoted span that stays open across
# `maintain-width` and only closes after `#{window_id}` — writing
# `\"#{@agent_sidebar_bin}\"` (closing the span after the binary) splits the
# hook into separate arguments instead, and tmux's run-shell then executes
# argv[0] — the bare binary, in TUI mode, headless — which exits 1 and spams
# "<binary> exited 1" on every layout change.
if-shell 'tmux -V | awk "/^tmux / { v = \$2; sub(/^[a-z]+-/, \"\", v); split(v, p, \".\"); if (p[1] + 0 > 3 || (p[1] + 0 == 3 && p[2] + 0 >= 2)) ok = 1 } END { if (ok) exit 0; exit 1 }"' 'set-hook -ga window-layout-changed "run-shell -b \"#{@agent_sidebar_bin} maintain-width #{window_id}\""'
if-shell 'tmux -V | awk "/^tmux / { v = \$2; sub(/^[a-z]+-/, \"\", v); split(v, p, \".\"); if (p[1] + 0 > 3 || (p[1] + 0 == 3 && p[2] + 0 >= 2)) ok = 1 } END { if (ok) exit 0; exit 1 }"' 'set-hook -ga client-resized "run-shell -b \"#{@agent_sidebar_bin} maintain-width #{window_id}\""'
