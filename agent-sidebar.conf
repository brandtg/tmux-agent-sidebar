# tmux-agent-sidebar plugin
# Load via the entry point script:
#   run-shell /path/to/tmux-agent-sidebar.tmux
#
# Customizable options (set BEFORE loading to override):
#   @sidebar_width        - sidebar width in columns, or percentage of window width (default: 15%)
#   @sidebar_width_max    - upper bound on the resolved sidebar width, in columns: a
#                           percentage width keeps growing with the window (and tmux
#                           grows an open sidebar when the window gains columns), so
#                           this caps it on very wide screens. Applied when the split
#                           is created and re-applied by the maintain-width hook on
#                           window resizes. Unset or 0 means no cap
#   @sidebar_position     - sidebar placement: left or right (default: left)
#   @sidebar_default_compact_view - whether a newly opened sidebar starts in
#                           compact mode (one line per agent; toggle live with
#                           `c` inside the sidebar). on or off (default: off)
#   @sidebar_default_todo_hide_completed - whether a newly opened sidebar
#                           starts with completed TODO items hidden (toggle
#                           live with `H` in the TODO panel, opened with `t`).
#                           on or off (default: on)
#   @sidebar_default_todo_visible - whether a newly opened sidebar starts
#                           with the TODO panel open (toggle live with `t`).
#                           on or off (default: off)
#   @sidebar_session_windows - when the panel groups by session (the `s`
#                           view), render each window's rows under a muted
#                           index:name header — the Session > Window >
#                           agent|process hierarchy. on or off (default: off)
#   @sidebar_worktree_windows - when the panel groups by repo/worktree
#                           (the default view), render each window's rows
#                           under a muted index:name header — the
#                           Repo > Window > agent|process hierarchy. on
#                           or off (default: off)
#   @sidebar_worktree_titles - title agent rows by the linked worktree they
#                           work in when the session has no user-given name
#                           (Claude's auto-derived names are hidden); the
#                           branch line then shows just the branch.
#                           on or off (default: off)
#   @sidebar_todo_scope   - whether the TODO panel's open/closed state is
#                           shared across every sidebar (`global`, default)
#                           or kept per sidebar (`local`). The item list is
#                           always shared through
#                           ~/.local/state/tmux-agent-sidebar/todos.txt.
#                           global or local (default: global)
#   @sidebar_preview_lines - maximum lines for the agent message preview
#                           (the prompt / response body wrapped under the
#                           status row), clamped to 1-10 (default: 2; set
#                           3 for the older taller preview)
#   @sidebar_popup_max_width - windows narrower than this many columns open the
#                              sidebar as a tmux popup (popover) instead of a
#                              split pane.
#                              Entering the popup view stops any split-pane
#                              sidebars still running in the session, and a
#                              toggle press on a narrow window swaps a desktop
#                              split pane for the popup directly
#                              (default: 100, 0 to always use a split pane).
#                              The toggle-all sweep ignores this threshold and
#                              creates split panes everywhere, so "open on
#                              every window" stays uniform even when a small
#                              client has shrunk some windows. On viewports
#                              narrower than this threshold the sidebar also
#                              auto-hides when the window shrinks (see
#                              @sidebar_auto_hide): the next toggle press
#                              opens the modal popup.
#   @sidebar_auto_hide    - auto-hide a split-pane sidebar when its window
#                           shrinks below @sidebar_popup_max_width (a phone or
#                           other small client attached or resized): the
#                           window's own sidebar pane closes and its saved
#                           layout replays, so the real panes keep the whole
#                           viewport. The hide also fires when a client
#                           narrower than the threshold drives the window
#                           (attaching, switching windows, or resizing) even
#                           without a recorded width crossing, so attaching
#                           from a phone always lands on a sidebar-less
#                           window. Per-window and symmetric: the hide marks
#                           the window (@sidebar_auto_hidden) and the same
#                           hook reopens the split when a wide viewport
#                           drives the window again — the window regrows
#                           past the threshold, or a client at/above the
#                           threshold selects it — so sidebar visibility
#                           follows the device currently driving the window.
#                           Manual closes (toggle/summon keys) and the
#                           toggle-all sweep clear the mark and are never
#                           undone. Only an actual crossing of the threshold
#                           counts for the window-width rules, so sidebars
#                           deliberately created by the toggle-all sweep on
#                           narrow windows are left alone unless a narrow
#                           client drives them.
#                           on or off (default: on)
#   @sidebar_auto_create  - create sidebar automatically for new windows and
#                           sessions (default: on)
#   @sidebar_layout_keys  - rebind prefix M-1..M-5 to sidebar-aware
#                           versions of tmux's builtin layouts: the
#                           sidebar pane keeps its configured edge and
#                           width while the real panes get the builtin's
#                           geometry (tmux 3.8+; stock `select-layout`
#                           keys are only replaced when still at their
#                           defaults). Applying one records the window's
#                           @sidebar_layout_base, after which layout
#                           changes re-pin the sidebar width and closing
#                           the sidebar restores the recorded builtin.
#                           on or off (default: on)
#   @sidebar_auto_create_delay - seconds to defer auto-create after a new window
#                                or session is created so a declaratively-built
#                                window (e.g. tmuxinator's split-window +
#                                select-layout) finishes first; accepts fractional
#                                seconds (default: 0)
#   @sidebar_key          - keybinding to toggle sidebar (default: e)
#   @sidebar_key_all      - keybinding to toggle sidebar in all windows (default: E)
#   @sidebar_overview_key - optional keybinding opening the fullscreen agent
#                           overview popup from anywhere (default: unset —
#                           no binding; the sidebar's own o key always opens it)
#   @sidebar_switch_key   - optional keybinding opening the quick switcher —
#                           a fuzzy finder over live agent panes that jumps
#                           to the chosen pane on enter (default: unset —
#                           no binding)
#   @sidebar_switch_width  - switcher popup width, a tmux popup size string
#                            (percentage or columns) (default: 80%)
#   @sidebar_switch_height - switcher popup height, a tmux popup size string
#                            (percentage or rows) (default: 60%)
#   @sidebar_color_*      - 256-color codes or #RRGGBB hex colors for sidebar elements
#
# Internal tmux options used by the plugin:
#   @agent_sidebar_dir    - plugin directory (auto-detected by tmux-agent-sidebar.tmux)
#   @sidebar_pid          - pid of the sidebar process owning a pane; cleared on
#                           exit, and only signaled after the notify-focus hook
#                           verifies it still belongs to the sidebar binary
#   @sidebar_mode         - sidebar mode written by toggle-all (globally)
#                           ("open" / "closed"); new windows and sessions
#                           consult it (falling back to
#                           @sidebar_auto_create while unset) to decide
#                           whether to create a sidebar. prefix+E means
#                           "always on/off everywhere" for future windows
#                           and sessions too. Per-window toggle presses
#                           ignore it.
#   @sidebar_last_window_width - last window width observed by the
#                           maintain-width hook (window-scoped, written by the
#                           plugin); used to detect a crossing of
#                           @sidebar_popup_max_width in either direction
#   @sidebar_auto_hidden - set to 1 by the maintain-width auto-hide when it
#                           closes a window's sidebar, cleared by every other
#                           close path; the maintain-width restore reopens the
#                           window's split sidebar only while it is set
#   @sidebar_layout_base - name of the last sidebar-aware builtin applied to
#                           the window (prefix+M-1..M-5); opts the window into
#                           the layout re-pin hook and the base-builtin
#                           restore on close. Unset with
#                           `tmux set -wu @sidebar_layout_base` to return a
#                           window to stock layout behavior

# --- Plugin location ---
# @agent_sidebar_dir must be set by tmux-agent-sidebar.tmux before sourcing this file

# --- Sidebar options ---
# Colors are managed in Rust (src/ui/colors.rs). Users may override any
# @sidebar_color_* tmux option in their own config. Non-color sidebar
# options are seeded here only when unset.
if -F '#{==:#{@sidebar_width},}' 'set -g @sidebar_width 15%'
if -F '#{==:#{@sidebar_position},}' 'set -g @sidebar_position left'
if -F '#{==:#{@sidebar_default_compact_view},}' 'set -g @sidebar_default_compact_view off'
if -F '#{==:#{@sidebar_default_show_windows},}' 'set -g @sidebar_default_show_windows off'
if -F '#{==:#{@sidebar_default_todo_hide_completed},}' 'set -g @sidebar_default_todo_hide_completed on'
if -F '#{==:#{@sidebar_default_todo_visible},}' 'set -g @sidebar_default_todo_visible off'
if -F '#{==:#{@sidebar_todo_scope},}' 'set -g @sidebar_todo_scope global'
# How the agents panel groups panes: "repo" (git repo root, default) or
# "session" (tmux session name — with @sidebar_show_windows on, the panel
# becomes an agent-forward session manager).
if -F '#{==:#{@sidebar_group_by},}' 'set -g @sidebar_group_by repo'
# Session-mode window level: when the panel groups by "session", render
# each window's rows under a muted index:name header (the
# Session > Window > agent|process hierarchy).
if -F '#{==:#{@sidebar_session_windows},}' 'set -g @sidebar_session_windows off'
# Repo-mode window level: when the panel groups by "repo", render each
# window's rows under a muted index:name header (the
# Repo > Window > agent|process hierarchy).
if -F '#{==:#{@sidebar_worktree_windows},}' 'set -g @sidebar_worktree_windows off'
# Worktree row titles: a session without a user-given name is titled by its
# linked worktree instead of the agent's auto-derived name.
if -F '#{==:#{@sidebar_worktree_titles},}' 'set -g @sidebar_worktree_titles off'
# Agent message preview (prompt / response body under the status row):
# maximum wrapped lines, clamped to 1-10. Default 2; set 3 for the older
# taller preview.
if -F '#{==:#{@sidebar_preview_lines},}' 'set -g @sidebar_preview_lines 2'
if -F '#{==:#{@sidebar_popup_max_width},}' 'set -g @sidebar_popup_max_width 100'
if -F '#{==:#{@sidebar_auto_hide},}' 'set -g @sidebar_auto_hide on'
if -F '#{==:#{@sidebar_auto_create},}' 'set -g @sidebar_auto_create on'
if -F '#{==:#{@sidebar_auto_create_delay},}' 'set -g @sidebar_auto_create_delay 0'
if -F '#{==:#{@sidebar_key},}' 'set -g @sidebar_key e'
if -F '#{==:#{@sidebar_key_all},}' 'set -g @sidebar_key_all E'

# --- Keybindings ---
# The path rides `#{q:pane_current_path}` bare — same shell-quoting fix
# as the auto-create hooks below (audit 2026-11-25 L-conf-1).
run-shell 'key="$(tmux display-message -p "#{@sidebar_key}")"; bin="$(tmux display-message -p "#{@agent_sidebar_bin}")"; tmux bind "$key" run-shell "\"$bin\" toggle \"##{window_id}\" ##{q:pane_current_path} \"##{client_width}\""'
run-shell 'key="$(tmux display-message -p "#{@sidebar_key_all}")"; bin="$(tmux display-message -p "#{@agent_sidebar_bin}")"; tmux bind "$key" run-shell "\"$bin\" toggle-all"'
# The overview keybinding is opt-in: bind only when the user set
# @sidebar_overview_key, so no default key is claimed. Like the toggle
# bindings it runs the installed binary via run-shell, and it passes the
# pressing client's name — a run-shell child has no current client of its
# own, so without it a second attached client could own the popup.
run-shell 'key="$(tmux display-message -p "#{@sidebar_overview_key}")"; if [ -n "$key" ]; then bin="$(tmux display-message -p "#{@agent_sidebar_bin}")"; tmux bind "$key" run-shell "\"$bin\" overview --popup --popup-client \"##{client_name}\""; fi'
# The switcher keybinding is opt-in like the overview's: bind only when
# the user set @sidebar_switch_key, so no default key is claimed. Same
# popup-client pass-through — the pressing client must own the popup so
# the jump lands on it.
run-shell 'key="$(tmux display-message -p "#{@sidebar_switch_key}")"; if [ -n "$key" ]; then bin="$(tmux display-message -p "#{@agent_sidebar_bin}")"; tmux bind "$key" run-shell "\"$bin\" switch --popup --popup-client \"##{client_name}\""; fi'

# --- Hooks (remove our own entries first to prevent duplicates on config reload) ---
run-shell 'tmux show-hooks -g after-new-window | awk "/@agent_sidebar_bin/ && /toggle --create-only/ { print \$1 }" | xargs -rn1 tmux set-hook -gu'
run-shell 'tmux show-hooks -g after-new-session | awk "/@agent_sidebar_bin/ && /toggle --create-only/ { print \$1 }" | xargs -rn1 tmux set-hook -gu'
run-shell 'tmux show-hooks -g after-select-pane | awk "/@sidebar_pid/ && /kill -USR1/ { print \$1 }" | xargs -rn1 tmux set-hook -gu'
run-shell 'tmux show-hooks -g after-select-window | awk "/@sidebar_pid/ && /kill -USR1/ { print \$1 }" | xargs -rn1 tmux set-hook -gu'
# Legacy kill -USR1 hooks (pre-identity-check) are removed above; these
# clear the current notify-focus hooks before re-registering below.
run-shell 'tmux show-hooks -g after-select-pane | awk "/notify-focus/ { print \$1 }" | xargs -rn1 tmux set-hook -gu'
run-shell 'tmux show-hooks -g after-select-window | awk "/notify-focus/ { print \$1 }" | xargs -rn1 tmux set-hook -gu'
run-shell 'tmux show-hooks -g client-session-changed | awk "/notify-focus/ { print \$1 }" | xargs -rn1 tmux set-hook -gu'
run-shell 'tmux show-hooks -g pane-exited | awk "/@agent_sidebar_bin/ && /auto-close/ { print \$1 }" | xargs -rn1 tmux set-hook -gu'
run-shell 'tmux show-hooks -g window-layout-changed | awk "/@agent_sidebar_bin/ && /maintain-width/ { print \$1 }" | xargs -rn1 tmux set-hook -gu'
run-shell 'tmux show-hooks -g client-resized | awk "/@agent_sidebar_bin/ && /maintain-width/ { print \$1 }" | xargs -rn1 tmux set-hook -gu'
run-shell 'tmux show-hooks -g client-session-changed | awk "/@agent_sidebar_bin/ && /maintain-width/ { print \$1 }" | xargs -rn1 tmux set-hook -gu'
run-shell 'tmux show-hooks -g after-select-window | awk "/@agent_sidebar_bin/ && /maintain-width/ { print \$1 }" | xargs -rn1 tmux set-hook -gu'

# --- Auto sidebar on new window / new session (create-only, no toggle) ---
# The hooks fire on every new window and every new session; whether a
# sidebar is actually created is decided by the binary at fire time from
# @sidebar_mode (written by toggle-all: `open`/`closed`) and, while no
# mode is recorded, from @sidebar_auto_create. Consulting at fire time
# (instead of registering the hook conditionally at load time) is what
# makes toggle-all mean "always on/off everywhere" for windows and
# sessions created afterwards. With @sidebar_auto_create_delay non-zero,
# the split is deferred into a backgrounded shell that sleeps first —
# this lets a declaratively-built window (e.g. tmuxinator's split-window
# + select-layout) finish before the sidebar pane is injected. The
# sync/deferred choice is fixed at load time; the duration itself is
# read at fire time.
#
# The path rides `#{q:pane_current_path}` bare (tmux's shell-quoting
# format modifier): interpolating `#{pane_current_path}` inside a quoted
# span put a `"` in the path inside sh's quotes and corrupted the
# command (audit 2026-11-25 L-conf-1; verified on tmux 3.8 that q:'s
# escaping reaches the run-shell shell intact).
#
# after-new-session is required in addition to after-new-window: tmux
# does NOT fire after-new-window for the initial window of a session
# created with `new-session` (verified on tmux 3.7c), so without it a
# new session opened while @sidebar_mode is `open` stays sidebar-less.
# The window/pane format vars resolve to the new session's initial
# window in the after-new-session context. Both hooks route through the
# same `--create-only` path, which is idempotent (an existing sidebar is
# left alone), so a tmux version that fires both on session creation
# cannot produce a duplicate pane.
if -F '#{==:#{@sidebar_auto_create_delay},0}' {
  set-hook -ga after-new-window 'run-shell "\"#{@agent_sidebar_bin}\" toggle --create-only \"#{window_id}\" #{q:pane_current_path}"'
  set-hook -ga after-new-session 'run-shell "\"#{@agent_sidebar_bin}\" toggle --create-only \"#{window_id}\" #{q:pane_current_path}"'
} {
  set-hook -ga after-new-window 'run-shell -b "sleep \"#{@sidebar_auto_create_delay}\"; \"#{@agent_sidebar_bin}\" toggle --create-only \"#{window_id}\" #{q:pane_current_path}"'
  set-hook -ga after-new-session 'run-shell -b "sleep \"#{@sidebar_auto_create_delay}\"; \"#{@agent_sidebar_bin}\" toggle --create-only \"#{window_id}\" #{q:pane_current_path}"'
}

# --- Notify sidebar on pane/window focus change (SIGUSR1 → instant refresh) ---
# notify-focus checks each @sidebar_pid against the running process
# (/proc/$pid/exe on Linux, ps fallback on macOS) before signaling, so a
# stale or recycled pid can never receive SIGUSR1 — whose default
# disposition would terminate the unrelated new owner.
#
# client-session-changed covers the case the select hooks cannot: a plain
# `switch-client` (session chooser, next/previous session, the sidebar's
# own agent jump) fires NO after-select-* hook, so without it the sidebar
# in the destination session redraws from up-to-1s-old state and snaps on
# the next periodic tick. The hook fires with the client's new session as
# context, so #{window_id} expands to the window the user just landed on.
set-hook -ga after-select-pane "run-shell -b '\"#{@agent_sidebar_bin}\" notify-focus \"#{window_id}\"'"
set-hook -ga after-select-window "run-shell -b '\"#{@agent_sidebar_bin}\" notify-focus \"#{window_id}\"'"
set-hook -ga client-session-changed "run-shell -b '\"#{@agent_sidebar_bin}\" notify-focus \"#{window_id}\"'"

# --- Auto close window when only sidebar remains ---
set-hook -ga pane-exited 'run-shell "\"#{@agent_sidebar_bin}\" auto-close \"#{window_id}\""'

# --- Auto-hide / auto-restore a window's sidebar around the popup threshold ---
# `maintain-width` fires when a window with a split-pane sidebar just crossed
# @sidebar_popup_max_width downward (a phone client attached, or an existing
# small client shrank the window). Responsive-design style: sidebar visibility
# is a pure function of the viewport currently driving the window. The
# crossing window's own sidebar closes, its saved pre-sidebar layout replays
# so the real panes keep the whole viewport, and the window is marked
# @sidebar_auto_hidden. The mirror direction undoes exactly that: a marked
# window whose viewport is wide again — the window regrows past the threshold
# (the phone client went away and a wide client became the latest one), or a
# client at/above the threshold selects the window — reopens its split
# sidebar through the normal create path and clears the mark, so sidebar
# visibility follows the device actually driving the window. Manual closes
# (toggle/summon keys) and the toggle-all sweep clear the mark, so only an
# auto-hide is ever restored — no open is second-guessed and no closed window
# is resurrected against an explicit user action. The subcommand is
# idempotent and cheap, so firing it on several events is safe (two
# concurrent instances close the same pane or create through the same
# existing-sidebar check; the second kill/restore/create is a no-op):
# client-resized is the one that fires when a phone client attaches or
# resizes (a pure client resize does not fire window-layout-changed), while
# window-layout-changed covers pane-level layout churn.
#
# `#{client_width}` is forwarded as a second argument on every hook: the
# terminal width of the client that drove the event. When that client is
# itself narrower than the popup threshold, the hide fires even if the
# window's crossing memory disagrees — the record can be stale in either
# direction (a phone popup toggle or a forced toggle-all split writes the
# narrow width), but a sub-threshold client driving the window is direct
# evidence of a small viewport looking at it. This is what makes the
# attach flow seamless: a phone attaching (client-session-changed) or
# switching windows (after-select-window) into a session the desktop left
# sidebars open in hides them on arrival, without depending on any prior
# observation. The restore trigger is the direct inverse: a client at/above
# the threshold selecting the window reopens a marked window's sidebar even
# when no crossing was recorded (the window stayed wide while hidden).
# Window-scoped hooks without a client context (window-layout-changed from
# server-side churn) expand `#{client_width}` to the empty string, which the
# binary treats as "no client signal" — the crossing rules carry those
# events in both directions.
#
# window-layout-changed does not exist before tmux 3.2 (the hook name is
# rejected by `set-hook` on older servers), so that registration is gated on a
# shell version check and silently skipped below 3.2 — the feature is simply
# absent there, and no stale hook is left behind (the dedup block above still
# removes any entries on every reload). client-session-changed and
# after-select-window exist in every supported tmux, so those two are not
# gated.
#
# Quoting matters here: when the hook fires, tmux re-parses the stored command
# line, so `run-shell` must receive the binary + subcommand + window id as ONE
# argument. The `\"` opens a single quoted span that stays open across
# `maintain-width` and only closes after `#{window_id}` — writing
# `\"#{@agent_sidebar_bin}\"` (closing the span after the binary) splits the
# hook into separate arguments instead, and tmux's run-shell then executes
# argv[0] — the bare binary, in TUI mode, headless — which exits 1 and spams
# "<binary> exited 1" on every layout change.
if-shell 'tmux -V | awk "/^tmux / { v = \$2; sub(/^[a-z]+-/, \"\", v); split(v, p, \".\"); if (p[1] + 0 > 3 || (p[1] + 0 == 3 && p[2] + 0 >= 2)) ok = 1 } END { if (ok) exit 0; exit 1 }"' 'set-hook -ga window-layout-changed "run-shell -b \"#{@agent_sidebar_bin} maintain-width #{window_id} #{client_width}\""'
if-shell 'tmux -V | awk "/^tmux / { v = \$2; sub(/^[a-z]+-/, \"\", v); split(v, p, \".\"); if (p[1] + 0 > 3 || (p[1] + 0 == 3 && p[2] + 0 >= 2)) ok = 1 } END { if (ok) exit 0; exit 1 }"' 'set-hook -ga client-resized "run-shell -b \"#{@agent_sidebar_bin} maintain-width #{window_id} #{client_width}\""'
set-hook -ga client-session-changed "run-shell -b \"#{@agent_sidebar_bin} maintain-width #{window_id} #{client_width}\""
set-hook -ga after-select-window "run-shell -b \"#{@agent_sidebar_bin} maintain-width #{window_id} #{client_width}\""

# --- Sidebar-aware builtin layouts (prefix + M-1..M-5) ---
# tmux's builtin layout keys rearrange every pane in the window,
# including the sidebar TUI itself: prefix+M-2 stacks the sidebar into
# the layout, prefix+M-1 shrinks it to a slice, and the maintain-width
# hook then fights the result on every layout change. When
# @sidebar_layout_keys is on (default), the plugin rebinds prefix
# M-1..M-5 to sidebar-aware versions of the same five builtins: the
# sidebar pane is excluded from the arrangement and pinned to its
# configured edge at its configured width, and the real panes get
# exactly the geometry tmux's own builtin would have produced for them.
#
# The rebind only replaces keys still bound to tmux's stock default
# (`list-keys` must show `select-layout <name>` for that key); a key the
# user has customized is left alone. Set @sidebar_layout_keys off before
# loading to skip the rebinds entirely.
#
# Applying a layout records the window's @sidebar_layout_base; from then
# on the window-layout-changed hook below re-pins the sidebar whenever a
# layout change redistributes its width, and closing the sidebar
# restores the recorded base builtin (rebuilt at the current window
# size) instead of the pre-sidebar snapshot. To take a window back out
# of this mode: `tmux set -wu @sidebar_layout_base`.
#
# Requires tmux 3.8+ (JSON layout trees); older tmux keeps the stock
# bindings and behavior. Floating panes (tmux 3.8) are skipped: a window
# holding one keeps its stock layout behavior.
if -F '#{==:#{@sidebar_layout_keys},}' 'set -g @sidebar_layout_keys on'
run-shell 'if [ "$(tmux display-message -p "#{@sidebar_layout_keys}")" = "on" ]; then bin="$(tmux display-message -p "#{@agent_sidebar_bin}")"; for pair in "M-1 even-horizontal" "M-2 even-vertical" "M-3 main-horizontal" "M-4 main-vertical" "M-5 tiled"; do key="${pair%% *}"; name="${pair#* }"; cur="$(tmux list-keys -T prefix "$key" 2>/dev/null)"; case "$cur" in *"select-layout $name"*) tmux bind-key "$key" run-shell -b "\"$bin\" layouts $name \"##{window_id}\"";; esac; done; fi'
# Re-pin hook: only fires meaningfully on windows with a recorded
# @sidebar_layout_base (the binary checks). Same tmux 3.8 gate as the
# JSON layouts themselves.
run-shell 'tmux show-hooks -g window-layout-changed | awk "/@agent_sidebar_bin/ && /layouts --keep/ { print \$1 }" | xargs -rn1 tmux set-hook -gu'
if-shell 'tmux -V | awk "/^tmux / { v = \$2; sub(/^[a-z]+-/, \"\", v); split(v, p, \".\"); if (p[1] + 0 > 3 || (p[1] + 0 == 3 && p[2] + 0 >= 8)) ok = 1 } END { if (ok) exit 0; exit 1 }"' 'set-hook -ga window-layout-changed "run-shell -b \"#{@agent_sidebar_bin} layouts --keep #{window_id}\""'
