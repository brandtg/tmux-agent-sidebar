name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      part:
        description: "SemVer component to bump (none = release the version already in Cargo.toml)"
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major
          - none

permissions:
  contents: write

jobs:
  # Dispatch path: bump the version and push the bump commit and the tag
  # from here, so cutting a release is one remote action with no local git
  # state. The tag-push path skips this job entirely (a GITHUB_TOKEN tag
  # push can't trigger another workflow, so bump and build share one run).
  bump:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: plan
        name: Plan the version
        env:
          PART: ${{ inputs.part }}
        run: |
          set -euo pipefail
          current="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml)"
          case "$PART" in
            patch|minor|major)
              new="$(awk -v v="$current" -v part="$PART" 'BEGIN {
                split(v, a, ".")
                if (part == "major")      { a[1]++; a[2] = 0; a[3] = 0 }
                else if (part == "minor") { a[2]++; a[3] = 0 }
                else                      { a[3]++ }
                print a[1] "." a[2] "." a[3]
              }')"
              ;;
            none)
              new="$current"
              ;;
            *)
              echo "::error::part must be patch, minor, major, or none (got '$PART')"
              exit 1
              ;;
          esac
          echo "tag=v$new" >> "$GITHUB_OUTPUT"
          echo "version=$new" >> "$GITHUB_OUTPUT"
          echo "release plan: $current -> $new (tag v$new)"

      # Resume semantics, three modes:
      # - full: the tag already exists and points at this ref's HEAD — a
      #   previous run finished the mutations; skip straight to the build.
      # - landed: the base branch already carries the planned version — a
      #   previous run's bump PR merged but the tag never went up; skip the
      #   bump and tag the base tip.
      # - fresh: do the bump, land it via PR, then tag.
      # A tag pointing anywhere else than HEAD is a hard conflict.
      - id: resume
        name: Check for an existing tag or landed bump
        env:
          TAG: ${{ steps.plan.outputs.tag }}
          VERSION: ${{ steps.plan.outputs.version }}
          BASE: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mode="fresh"
          tag_sha="$(git ls-remote origin "refs/tags/$TAG" | awk -F'\t' -v t="refs/tags/$TAG" '$2 == t {s = $1} $2 == t "^{}" {s = $1} END {print s}')"
          if [ -n "$tag_sha" ]; then
            if [ "$tag_sha" != "$GITHUB_SHA" ]; then
              echo "::error::tag $TAG already exists on origin at ${tag_sha:0:7}, not this ref's HEAD (${GITHUB_SHA:0:7})"
              exit 1
            fi
            mode="full"
            echo "tag $TAG already exists at ${tag_sha:0:7}; resuming the release"
          else
            base_version="$(git show "origin/$BASE":Cargo.toml | sed -n 's/^version = "\(.*\)"/\1/p')"
            if [ "$base_version" = "$VERSION" ]; then
              mode="landed"
              echo "$BASE already carries $VERSION; skipping the bump and tagging its tip"
            fi
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Bump the version
        if: steps.resume.outputs.mode == 'fresh' && inputs.part != 'none'
        run: make bump part=${{ inputs.part }}

      - name: Run checks
        if: steps.resume.outputs.mode == 'fresh' && inputs.part != 'none'
        run: make ci

      # Land the bump through its own pull request: the base branch's
      # ruleset requires changes to arrive via PR, and a merge is exactly
      # that — no bypass actors needed. Requires the repo setting
      # "Allow GitHub Actions to create and approve pull requests".
      # If the token can't merge (protection added later), it waits for a
      # manual merge; a re-run of the workflow picks up from there.
      - name: Land the bump through a PR
        if: steps.resume.outputs.mode == 'fresh' && inputs.part != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: release-bump/${{ steps.plan.outputs.tag }}
          BASE: ${{ github.ref_name }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add Cargo.toml Cargo.lock .claude-plugin/plugin.json
          git commit -m "Bump version to $version"
          git push --force origin "$BRANCH"
          number="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --base "$BASE" --json number --jq '.[0].number // empty')"
          if [ -z "$number" ]; then
            url="$(gh pr create --repo "$GITHUB_REPOSITORY" \
              --base "$BASE" --head "$BRANCH" \
              --title "Bump version to $version" \
              --body "Automatic version bump for the $TAG release, opened by the Release workflow.")"
            number="${url##*/}"
          fi
          echo "bump PR: #$number"
          if ! merge_err="$(gh pr merge "$number" --repo "$GITHUB_REPOSITORY" --squash 2>&1)"; then
            echo "::notice::auto-merge failed ($merge_err); waiting up to 15 min for a manual merge of ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/pull/$number"
          fi
          for i in $(seq 1 60); do
            state="$(gh pr view "$number" --repo "$GITHUB_REPOSITORY" --json state --jq .state)"
            [ "$state" = "MERGED" ] && break
            sleep 15
          done
          if [ "$(gh pr view "$number" --repo "$GITHUB_REPOSITORY" --json state --jq .state)" != "MERGED" ]; then
            echo "::error::PR #$number never merged. Merge it, then re-run this workflow — the landed bump is detected and the release resumes."
            exit 1
          fi
          git push origin --delete "$BRANCH" 2>/dev/null || true

      - name: Tag and push
        if: steps.resume.outputs.mode != 'full'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
          VERSION: ${{ steps.plan.outputs.version }}
          BASE: ${{ github.ref_name }}
          PART: ${{ inputs.part }}
        run: |
          set -euo pipefail
          # No bump: tag exactly what was dispatched. Bump: tag the base
          # tip the PR merge just landed (or an earlier run landed).
          if [ "$PART" = "none" ]; then
            sha="$GITHUB_SHA"
          else
            git fetch origin "$BASE"
            sha="$(git rev-parse "origin/$BASE")"
          fi
          tagged="$(git show "$sha":Cargo.toml | sed -n 's/^version = "\(.*\)"/\1/p')"
          if [ "$tagged" != "$VERSION" ]; then
            echo "::error::$sha carries Cargo.toml version $tagged, expected $VERSION — another push landed mid-release; re-run the workflow"
            exit 1
          fi
          git tag "$TAG" "$sha"
          git push origin "$TAG"

  build:
    needs: bump
    if: ${{ needs.bump.result == 'success' || needs.bump.result == 'skipped' }}
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            asset: tmux-agent-sidebar-darwin-aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            asset: tmux-agent-sidebar-darwin-x86_64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            asset: tmux-agent-sidebar-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            asset: tmux-agent-sidebar-linux-aarch64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Dispatch: the tag the bump job created pins the exact content
          # even if the branch moves during the build. Tag push: that tag.
          ref: ${{ needs.bump.outputs.tag && format('refs/tags/{0}', needs.bump.outputs.tag) || github.ref }}

      - name: Install Rust toolchain
        run: |
          rustup target add ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary
        run: cp "target/${{ matrix.target }}/release/tmux-agent-sidebar" "${{ matrix.asset }}"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: [bump, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true

      - name: Generate changelog
        id: changelog
        env:
          # Dispatch: the tag the bump job pushed. Tag push: the pushed tag
          # (bump is skipped, so its outputs are empty here).
          RELEASE_REF: ${{ needs.bump.outputs.tag || github.ref_name }}
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | sed -n '2p')
          # No prior tag → first release. This repo carries upstream's full
          # history, so anchor the changelog at the fork point instead of
          # listing every upstream commit too.
          : "${PREV_TAG:=fb11818}"
          CHANGELOG=$(git log --pretty=format:"- %s (%h)" "${PREV_TAG}..${RELEASE_REF}")
          {
            echo "body<<EOF"
            echo "## What's Changed"
            echo ""
            echo "$CHANGELOG"
            echo ""
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${RELEASE_REF}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.bump.outputs.tag || github.ref_name }}
          body: ${{ steps.changelog.outputs.body }}
          files: tmux-agent-sidebar-*
