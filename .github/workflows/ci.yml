name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo test
      - run: cargo clippy
      - run: cargo fmt --check
      - name: OpenCode bridge suite
        run: node --test .opencode/plugins/tmux-agent-sidebar.test.mjs
